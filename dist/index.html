<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="在浏览器内调整图片的像素尺寸和文件大小。">
<title>图片改大小</title>
<style>
:root{font-family:"Inter","PingFang SC","Microsoft YaHei",sans-serif;color:#222138;background:#f8f8fc;font-synthesis:none;--ink:#222138;--muted:#625f76;--line:#e4e2ee;--purple:#5940ce;--light:#f0edff}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select{cursor:pointer}button:disabled{cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid #846df6;outline-offset:3px}[hidden]{display:none!important}
.topbar{background:white;border-bottom:1px solid var(--line)}.bar{max-width:1100px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:750}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--purple);color:white;font-size:20px;line-height:1}.privacy{font-size:12px;color:#3f6556;display:flex;align-items:center;gap:7px}.privacy:before{content:"";width:7px;height:7px;background:#42a67d;border-radius:50%}
main{max-width:1100px;margin:auto;padding:54px 24px 45px}.intro{margin-bottom:29px}h1{font-size:clamp(32px,6vw,48px);letter-spacing:-.045em;line-height:1.12;margin:0 0 12px;font-weight:800}.intro p{font-size:15px;margin:0;color:var(--muted)}
.layout{display:grid;grid-template-columns:1.34fr 1fr;gap:20px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 14px #22213806;min-width:0;padding:23px}.panel-header{display:flex;align-items:center;justify-content:space-between;min-height:25px;gap:10px;margin-bottom:17px}h2{font-size:17px;margin:0}.small{font-size:12px;color:var(--muted)}.ghost{background:none;border:0;color:var(--purple);padding:3px 0;font-size:13px}
.drop{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:11px;min-height:320px;background:#faf9ff;border:1.5px dashed #c9bdf7;border-radius:13px;text-align:center;padding:20px;cursor:pointer}.drop:hover,.drop.drag{background:#f1edff;border-color:#846df6}.file-input{position:absolute;width:1px;height:1px;opacity:0}.upload-icon{display:grid;place-items:center;background:var(--light);color:var(--purple);width:48px;height:48px;border-radius:14px;font-size:28px;line-height:1}.drop strong{font-size:16px}.pick{margin-top:6px;color:white;background:var(--purple);font-size:14px;font-weight:650;padding:9px 16px;border-radius:9px}
.preview{min-height:320px;height:320px;background-color:#f5f3fa;background-image:conic-gradient(#eae7f1 25%,transparent 0 50%,#eae7f1 0 75%,transparent 0);background-size:20px 20px;border-radius:13px;display:grid;place-items:center;padding:12px}.preview img{display:block;max-width:100%;max-height:296px;object-fit:contain}.meta{margin:15px 0 0;display:flex;flex-wrap:wrap;gap:8px}.meta span{font-size:12px;border-radius:7px;background:#f1eff7;padding:5px 8px}.filename{margin:11px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
form{display:grid;gap:18px}.section{display:grid;gap:9px}.section+.section{border-top:1px solid var(--line);padding-top:17px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-heading strong{font-size:14px}.lock{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}.lock input{accent-color:var(--purple);margin:0;width:15px;height:15px}.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}.field{display:grid;gap:5px;font-size:12px;color:var(--muted)}.control{position:relative;display:flex;min-width:0}.control input,.control select{min-width:0;width:100%;padding:10px 11px;border:1px solid #dad7e6;border-radius:9px;background:#fff;color:var(--ink);font-size:14px;height:41px}.control.with-unit input{padding-right:32px}.unit{position:absolute;right:10px;top:13px;font-size:11px;pointer-events:none}.limit{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:8px}.hint{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.export{width:100%;border:0;border-radius:10px;background:var(--purple);color:white;font-size:14px;font-weight:700;padding:12px;min-height:44px}.export:hover:not(:disabled){background:#4931b8}.export:disabled{background:#e8e3f9;color:#60547d}.status{font-size:13px;line-height:1.6;margin:0;color:#2c6954;overflow-wrap:anywhere}.status:empty{display:none}.status.error{color:#a52b36}.source-status{margin-top:11px}.source-status:empty{margin:0}
.file-input:focus-visible + .drop{outline:3px solid #846df6;outline-offset:3px}
.export-save{background:white;color:var(--purple);border:1px solid var(--purple)}
.export-save:hover:not(:disabled){background:var(--light)}
@media(max-width:720px){main{padding:32px 16px}.bar{padding:12px 16px}.layout{grid-template-columns:1fr;gap:14px}.panel{padding:17px}.intro{margin-bottom:20px}.drop,.preview{min-height:240px}.preview{height:240px}.preview img{max-height:216px}}@media(max-width:350px){.privacy{font-size:10px}.brand{font-size:13px}}
</style>
</head>
<body>
<header class="topbar"><div class="bar"><div class="brand"><span class="mark" aria-hidden="true">↔</span>图片改大小</div><div class="privacy">图片仅在本机处理</div></div></header>
<main>
  <div class="intro"><h1>图片改大小</h1><p>调整像素尺寸、压缩文件体积，设置好后直接下载。</p></div>
  <div class="layout">
    <section class="panel" aria-labelledby="source-title">
      <div class="panel-header"><h2 id="source-title">原始图片</h2><button class="ghost" type="button" id="replace" hidden>更换图片</button></div>
      <input class="file-input" type="file" id="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" aria-label="选择图片">
      <label class="drop" id="drop" for="file">
        <span class="upload-icon" aria-hidden="true">↑</span><strong>拖放图片到这里</strong>
        <span class="small">支持 JPG、PNG、WebP</span><span class="pick">选择图片</span>
      </label>
      <div class="preview" id="preview" hidden><img id="image" alt="原始图片预览"></div>
      <p class="filename" id="filename" hidden></p>
      <div class="meta" id="meta" hidden><span id="dimensions"></span><span id="bytes"></span><span id="type"></span></div>
      <p class="status error source-status" id="source-status" role="status"></p>
    </section>
    <section class="panel" aria-labelledby="settings-title">
      <div class="panel-header"><h2 id="settings-title">导出设置</h2></div>
      <form id="settings">
        <div class="section">
          <div class="section-heading"><strong>像素尺寸</strong><label class="lock"><input type="checkbox" id="lock" checked>锁定比例</label></div>
          <div class="fields">
            <label class="field">宽度<span class="control with-unit"><input id="width" type="number" min="1" step="1" required><span class="unit">px</span></span></label>
            <label class="field">高度<span class="control with-unit"><input id="height" type="number" min="1" step="1" required><span class="unit">px</span></span></label>
          </div>
        </div>
        <div class="section">
          <div class="section-heading"><strong><label for="limit">文件大小上限</label></strong><span class="small">选填</span></div>
          <div class="limit"><div class="control"><input id="limit" type="number" min="0" step="any" placeholder="例如 500" aria-describedby="size-hint"></div><div class="control"><select id="unit" aria-label="文件大小单位"><option>KB</option><option>MB</option></select></div></div>
          <p class="hint" id="size-hint">PNG 超过上限时，可减小像素尺寸或提高上限。</p>
        </div>
        <div class="section">
          <div class="section-heading"><strong><label for="format">导出格式</label></strong></div>
          <div class="control"><select id="format" aria-describedby="format-hint"><option value="image/jpeg" selected>JPG</option><option value="image/png">PNG</option></select></div>
          <p class="hint" id="format-hint">导出为 JPG 时，透明区域填充为白色。</p>
        </div>
        <button class="export export-save" id="save" type="submit" hidden disabled>导出并另存为</button>
        <button class="export" id="export" type="submit" hidden disabled>导出并下载</button>
        <p class="status" id="status" role="status"></p>
      </form>
    </section>
  </div>
</main>
<script>
"use strict";
const byId = id => document.getElementById(id);
const fileInput = byId("file");
const drop = byId("drop");
const sourceStatus = byId("source-status");
const image = byId("image");
const settings = byId("settings");
const width = byId("width");
const height = byId("height");
const lock = byId("lock");
const limit = byId("limit");
const unit = byId("unit");
const format = byId("format");
const exportButton = byId("export");
const saveButton = byId("save");
const canSaveLocally = typeof window.showSaveFilePicker === "function";
saveButton.hidden = !canSaveLocally;
exportButton.hidden = canSaveLocally;
const status = byId("status");
const extensions = {"image/jpeg":"jpg", "image/png":"png", "image/webp":"webp"};
const units = {KB: 1024, MB: 1024 ** 2};
let source;
let selection = 0;
let loading = false;
let exporting = false;
let lastDimension = width;

function formatSize(bytes) {
  const scale = bytes >= units.MB ? "MB" : bytes >= units.KB ? "KB" : "B";
  return new Intl.NumberFormat("zh-CN", {maximumFractionDigits: 2}).format(bytes / (units[scale] || 1)) + " " + scale;
}

function targetBytes() {
  return limit.value === "" ? Infinity : Math.floor(limit.valueAsNumber * units[unit.value]);
}

function syncButton() {
  const bytes = targetBytes();
  limit.setCustomValidity(bytes < 1 ? "请输入至少相当于 1 字节的大小。" : "");
  exportButton.disabled = !source || loading || exporting || !settings.checkValidity();
  saveButton.disabled = exportButton.disabled;
  exportButton.textContent = exporting ? "正在处理…" : "导出并下载";
}

function report(message, error = false) {
  status.textContent = message;
  status.classList.toggle("error", error);
}

async function importImage(file) {
  if (!file) return;
  const current = ++selection;
  loading = true;
  sourceStatus.textContent = "";
  report("");
  syncButton();
  let url;
  try {
    const signature = new Uint8Array(await file.slice(0, 12).arrayBuffer());
    const header = String.fromCharCode(...signature);
    const type = header.startsWith("\xFF\xD8\xFF") ? "image/jpeg"
      : header.startsWith("\x89PNG\r\n\x1a\n") ? "image/png"
      : header.startsWith("RIFF") && header.slice(8,12) === "WEBP" ? "image/webp" : "";
    if (!type) throw new Error("请选择 JPG、PNG 或 WebP 图片。");
    url = URL.createObjectURL(file);
    const decoded = new Image();
    decoded.src = url;
    try { await decoded.decode(); }
    catch { throw new Error("无法读取这张图片，请换一张试试。"); }
    if (current !== selection) return;
    if (source) URL.revokeObjectURL(source.url);
    source = {file, type, url, decoded, width: decoded.naturalWidth, height: decoded.naturalHeight};
    image.src = url;
    url = undefined;
    width.value = source.width;
    height.value = source.height;
    lock.checked = true;
    lastDimension = width;
    limit.value = "";
    unit.value = "KB";
    byId("filename").textContent = file.name;
    byId("dimensions").textContent = source.width + " × " + source.height + " px";
    byId("bytes").textContent = formatSize(file.size);
    byId("type").textContent = extensions[type].toUpperCase();
    for (const id of ["preview", "filename", "meta", "replace"]) byId(id).hidden = false;
    drop.hidden = true;
  } catch (error) {
    if (current === selection) sourceStatus.textContent = error.message || "无法读取图片。";
  } finally {
    if (url) URL.revokeObjectURL(url);
    if (current === selection) {
      loading = false;
      syncButton();
    }
  }
}

function updateRatio() {
  if (!source || !lock.checked || !lastDimension.validity.valid) return;
  if (lastDimension === width) {
    height.value = Math.max(1, Math.round(width.valueAsNumber * source.height / source.width));
  } else {
    width.value = Math.max(1, Math.round(height.valueAsNumber * source.width / source.height));
  }
}

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  importImage(file);
});
byId("replace").addEventListener("click", () => fileInput.click());
for (const name of ["dragenter", "dragover"]) {
  drop.addEventListener(name, event => {event.preventDefault(); drop.classList.add("drag");});
}
drop.addEventListener("dragleave", event => {
  if (!drop.contains(event.relatedTarget)) drop.classList.remove("drag");
});
drop.addEventListener("drop", event => {
  event.preventDefault();
  drop.classList.remove("drag");
  importImage(event.dataTransfer.files[0]);
});
for (const eventName of ["dragover","drop"]) {
  window.addEventListener(eventName, event => {
    if (event.dataTransfer.types.includes("Files")) event.preventDefault();
  });
}
settings.addEventListener("input", event => {
  if (event.target === width || event.target === height) lastDimension = event.target;
  if ([width, height, lock].includes(event.target)) updateRatio();
  byId("format-hint").hidden = format.value !== "image/jpeg";
  report("");
  syncButton();
});

function encode(canvas, type, quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("无法生成图片，请尝试减小像素尺寸。")), type, quality);
  });
}

async function compressJpeg(canvas, maxBytes) {
  let best = await encode(canvas, "image/jpeg", 0);
  if (best.size > maxBytes) return null;
  let low = 0;
  let high = 1;
  for (let step = 0; step < 9; step++) {
    const quality = (low + high) / 2;
    const candidate = await encode(canvas, "image/jpeg", quality);
    if (candidate.size <= maxBytes) {
      low = quality;
      best = candidate;
    } else {
      high = quality;
    }
  }
  return best;
}

async function createOutput(original, w, h, maxBytes, type) {
  if (type === original.type && w === original.width && h === original.height && original.file.size <= maxBytes) {
    return original.file;
  }
  if (w > 16384 || h > 16384 || w * h > 67108864) {
    throw new Error("导出尺寸太大，请减小宽度或高度。");
  }
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  try {
    const context = canvas.getContext("2d");
    if (!context) {
      throw new Error("导出尺寸太大，请减小宽度或高度。");
    }
    context.imageSmoothingQuality = "high";
    if (type === "image/jpeg") {
      context.fillStyle = "#fff";
      context.fillRect(0, 0, w, h);
    }
    context.drawImage(original.decoded, 0, 0, w, h);
    const full = await encode(canvas, type, 1);
    if (full.type !== type) throw new Error("当前浏览器无法导出所选格式。");
    if (full.size <= maxBytes) return full;
    if (type === "image/jpeg") {
      const compressed = await compressJpeg(canvas, maxBytes);
      if (compressed) return compressed;
    }
    throw new Error("所选格式在当前像素尺寸下无法达到文件大小上限，请减小宽高或提高上限。");
  } finally {
    canvas.width = 0;
    canvas.height = 0;
  }
}

settings.addEventListener("submit", async event => {
  event.preventDefault();
  if (exportButton.disabled) return;
  const original = source;
  const current = selection;
  const w = width.valueAsNumber;
  const h = height.valueAsNumber;
  const maxBytes = targetBytes();
  const type = format.value;
  const extension = extensions[type];
  const filename = original.file.name.replace(/\.[^.]+$/, "") + "_" + w + "x" + h + "." + extension;
  const saveLocally = event.submitter === saveButton;
  exporting = true;
  report("");
  syncButton();
  try {
    const handle = saveLocally ? await window.showSaveFilePicker({
      suggestedName: filename,
      types: [{description: extension.toUpperCase(), accept: {[type]: ["." + extension]}}]
    }) : null;
    if (current !== selection) return;
    const blob = await createOutput(original, w, h, maxBytes, type);
    if (current !== selection) return;
    if (handle) {
      const writer = await handle.createWritable();
      try {
        await writer.write(blob);
        await writer.close();
      } catch (error) {
        await writer.abort().catch(() => {});
        throw error;
      }
    } else {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60_000);
    }
    if (current === selection) {
      const result = handle ? "已保存" : "已发起下载";
      report(result + " · " + w + " × " + h + " px · " + formatSize(blob.size) + " · " + extension.toUpperCase());
    }
  } catch (error) {
    if (current === selection && error.name !== "AbortError") {
      if (saveLocally && error.name === "SecurityError") exportButton.hidden = false;
      const message = saveLocally && error.name === "SecurityError"
        ? "当前浏览器环境无法打开保存窗口，请使用「导出并下载」。"
        : error.message || "导出失败，请重试。";
      report(message, true);
    }
  } finally {
    exporting = false;
    syncButton();
  }
});
</script>
</body>
</html>
